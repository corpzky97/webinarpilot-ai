<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM · WebinarPilot.AI</title><link rel="stylesheet" href="/styles.css"></head><body><nav><div class="wrap navin"><a class="brand" href="/">WebinarPilot.<b>AI</b></a><div class="links"><a href="/dashboard/">Dashboard</a><a href="/builder/">AI Builder</a><a href="/funnels/">Funnels</a><a href="/webinar-room/">Webinar Room</a><a href="/growth/">Growth</a><a href="/crm/">CRM</a><a href="/analytics/">Analytics</a><a href="/pricing/">Pricing</a></div></div></nav><main class="section"><div class="wrap"><span class="eyebrow">GROWTH CRM</span><h2 style="margin-top:18px">Turn webinar behavior into sales-ready lead intelligence.</h2><div class="kpis"><div class="kpi"><small>Total Leads</small><strong id="total">0</strong></div><div class="kpi"><small>Hot Leads</small><strong id="hot">0</strong></div><div class="kpi"><small>Warm Leads</small><strong id="warm">0</strong></div><div class="kpi"><small>Buy / Demo Intent</small><strong id="intentCount">0</strong></div></div><div class="glass" style="padding:24px;margin-top:18px"><div id="leadList" class="list"></div><div id="empty" style="color:var(--muted)">No captured leads yet. Add one from the Webinar Room.</div></div></div></main><script src="/app.js"></script><script>const leads=WebinarPilot.getLeads(),list=document.getElementById('leadList');let hot=0,warm=0,intent=0;if(leads.length)document.getElementById('empty').style.display='none';leads.forEach(l=>{const score=WebinarPilot.score(l);if(score>=75)hot++;else if(score>=55)warm++;if(l.intent==='Buy now'||l.intent==='Book a demo')intent++;const tier=score>=75?'Hot':score>=55?'Warm':'New';list.innerHTML+=`<div class="item"><div><b>${WebinarPilot.esc(l.name)}</b><br><small style="color:var(--muted)">${WebinarPilot.esc(l.email)} · ${WebinarPilot.esc(l.intent)}</small></div><div class="score"><b>${score}</b></div><span class="badge ${score>=75?'green':'gold'}">${tier}</span></div>`});document.getElementById('total').textContent=leads.length;document.getElementById('hot').textContent=hot;document.getElementById('warm').textContent=warm;document.getElementById('intentCount').textContent=intent;</script></body></html>
