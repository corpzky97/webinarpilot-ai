<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PinoyLink Newsroom Admin</title><link rel="stylesheet" href="/styles.css?v=9"></head><body>
<header class="topbar"><div class="wrap nav-wrap"><a class="brand" href="/">Pinoy<span>Link</span> Hawaiʻi</a><nav class="nav"><a href="/admin">Admin</a><a href="/admin-subscribers">Subscribers</a><a href="/admin-advertisers">Advertisers</a></nav><span class="pill">Private Newsroom</span></div></header>
<main class="section"><div class="wrap"><div class="eyebrow">Editorial operations</div><h1 style="font-size:clamp(2.8rem,6vw,5rem);margin-bottom:18px">Newsroom <span>Control</span></h1><p class="muted" style="max-width:820px">Review story intake, source quality, scores, sensitivity and editorial review status from one private screen.</p>
<section id="gate" class="admin-gate"><label for="token">Admin token</label><div class="admin-login-row"><input id="token" type="password" placeholder="Enter private admin token"><button id="open" class="subscribe-submit" type="button">Open newsroom</button></div><div id="status" class="form-status"></div></section>
<section id="panel" hidden><div class="pipeline-toolbar"><div><b id="count">0 stories</b><span id="updated">Not loaded</span></div><div class="pipeline-actions"><select id="desk"><option value="">All desks</option><option>hawaii</option><option>philippines</option><option>immigration</option><option>consular_travel</option><option>community</option><option>jobs_business</option><option>us_world</option><option>markets</option></select><select id="review"><option value="">All review states</option><option>auto_approved</option><option>needs_review</option><option>manual_approval</option><option>rejected</option></select><button id="refresh" class="share-btn">Refresh</button></div></div><div id="grid" class="pipeline-grid"></div><button id="more" class="cta secondary" hidden>Load more</button></section>
</div></main><script src="/admin-newsroom.js?v=1" defer></script></body></html>
