<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PinoyLink Subscribers Admin</title><link rel="stylesheet" href="/styles.css?v=9"></head><body>
<header class="topbar"><div class="wrap nav-wrap"><a class="brand" href="/">Pinoy<span>Link</span> Hawaiʻi</a><nav class="nav"><a href="/admin">Admin</a><a href="/admin-newsroom">Newsroom</a><a href="/admin-advertisers">Advertisers</a></nav><span class="pill">Private Subscribers</span></div></header>
<main class="section"><div class="wrap"><div class="eyebrow">Audience operations</div><h1 style="font-size:clamp(2.8rem,6vw,5rem);margin-bottom:18px">Subscriber <span>Dashboard</span></h1><p class="muted" style="max-width:820px">Review PinoyLink subscribers, status, language, island and interests from one private screen.</p>
<section id="gate" class="admin-gate"><label for="token">Admin token</label><div class="admin-login-row"><input id="token" type="password" placeholder="Enter private admin token"><button id="open" class="subscribe-submit" type="button">Open subscribers</button></div><div id="status" class="form-status"></div></section>
<section id="panel" hidden><div class="pipeline-toolbar"><div><b id="count">0 subscribers</b><span id="updated">Not loaded</span></div><div class="pipeline-actions"><select id="state"><option value="">All statuses</option><option>active</option><option>pending</option><option>unsubscribed</option></select><select id="island"><option value="">All islands</option><option>Oahu</option><option>Maui</option><option>Hawaii Island</option><option>Kauai</option><option>Molokai</option><option>Lanai</option><option>other</option></select><button id="refresh" class="share-btn">Refresh</button></div></div><div id="grid" class="pipeline-grid"></div><button id="more" class="cta secondary" hidden>Load more</button></section>
</div></main><script src="/admin-subscribers.js?v=1" defer></script></body></html>
