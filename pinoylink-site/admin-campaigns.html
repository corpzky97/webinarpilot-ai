<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#06131f"><title>PinoyLink Campaign Scheduler</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css?v=9"><link rel="stylesheet" href="/admin-data.css?v=1"><style>.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.toolbar input,.toolbar select,.card input,.card textarea,.card select{background:#061923;color:#fff;border:1px solid #ffffff1c;border-radius:12px;padding:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#0a1d29;border:1px solid #ffffff18;border-radius:20px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card textarea{min-height:82px;grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{border:0;border-radius:999px;padding:10px 14px;font-weight:800}.save{background:#f4bf4f;color:#06131f}.activate{background:#75d7c6;color:#06131f}.complete{background:#d7e6ed;color:#06131f}.muted2{color:#8fb0bf;font-size:.82rem}@media(max-width:820px){.grid,.fields{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="wrap nav-wrap"><a class="brand" href="/admin">Pinoy<span>Link</span> Admin</a><nav class="nav"><a href="/admin-revenue">Revenue</a><a href="/admin-campaign-report">Reports</a></nav><span class="pill">Campaign Scheduling</span></div></header><main><section class="hero"><div class="wrap"><div class="eyebrow">Paid → scheduled → active → completed</div><h1>Campaign <span>Scheduler</span></h1><p class="lead">Confirm dates, destination links, creative readiness, placement status and completion without treating preferred dates as confirmed.</p></div></section><section class="section"><div class="wrap"><div class="toolbar"><input id="token" type="password" placeholder="Admin token"><select id="filter"><option value="">All campaigns</option><option value="paid">Paid</option><option value="scheduled">Scheduled</option><option value="active">Active</option><option value="completed">Completed</option></select><button id="load" class="cta primary" type="button">Load campaigns</button></div><div id="status" class="muted"></div><div id="grid" class="grid" style="margin-top:18px"></div></div></section></main><script src="/admin-campaigns.js?v=1" defer></script></body></html>
